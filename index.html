<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Arcade – free browser games</title>
<meta name="description" content="Pick a game and start playing. No downloads, no sign-up.">
<meta name="theme-color" content="#100c33">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@700;900&display=swap">
<style>
:root{
  --bg:#100c33; --surface:#1a1550; --line:rgba(255,246,229,.13);
  --ink:#fff6e5; --muted:#aba5d8; --yellow:#ffd23f; --pink:#ff4fa3; --cyan:#2de2e6;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{display:flex;align-items:center;gap:10px;font:900 15px var(--display);text-transform:uppercase}
.logo .sp{font-size:26px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}

/* hero */
.hero{position:relative;padding:56px 0 72px;background:radial-gradient(50% 60% at 15% 20%,rgba(255,79,163,.2),transparent 70%),radial-gradient(40% 50% at 90% 10%,rgba(45,226,230,.16),transparent 70%)}
h1{margin:0 0 28px;font:900 clamp(48px,12.2vw,148px)/.92 var(--display);letter-spacing:-.045em;text-transform:uppercase}
h1 span{display:block}
h1 .a{text-shadow:.03em .03em 0 #3b30a8}
h1 .b{color:var(--yellow);text-shadow:.03em .03em 0 var(--pink),.06em .06em 0 var(--cyan)}
.lead{max-width:40ch;margin:0 0 32px;color:var(--muted);font-size:clamp(17px,2vw,21px)}
.search{position:relative;max-width:500px}
.search svg{position:absolute;left:18px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--muted)}
#search{width:100%;padding:17px 56px 17px 50px;background:var(--surface);border:2px solid var(--line);border-radius:16px;color:var(--ink);font:500 16px var(--body)}
#search::placeholder{color:var(--muted)}
#search:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 5px rgba(255,210,63,.16)}
kbd{position:absolute;right:16px;top:50%;translate:0 -50%;font:700 13px var(--body);color:var(--muted);border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:1px 9px}

/* attract mode emoji */
.sp{display:grid;place-items:center;line-height:1;filter:drop-shadow(0 0 16px hsl(var(--h) 100% 60%/.55))}
.art{display:flex;gap:18px;margin-top:40px}
.art .sp{font-size:52px}
@media(min-width:1080px){
  .art{position:absolute;right:24px;top:70px;display:grid;grid-template-columns:repeat(2,112px);gap:20px;margin:0}
  .art .sp{width:112px;height:112px;font-size:92px}
  .art .sp:nth-child(even){translate:0 44px}
}
.art .sp{animation:bob 2s steps(4) infinite}
.art .sp:nth-child(2){animation-delay:-.5s}.art .sp:nth-child(3){animation-delay:-1s}.art .sp:nth-child(4){animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-12px)}}
a.card:hover .sp,a.card:focus-visible .sp{animation:hop .5s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-8px) scale(1.08)}}

/* games */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:18px 24px;margin-bottom:28px}
h2{margin:0;font:900 clamp(28px,4vw,42px)/1 var(--display);letter-spacing:-.03em}
#count{margin:10px 0 0;color:var(--muted);font-size:15px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0;padding:0;list-style:none}
.grid li{display:flex}
.card{display:flex;flex-direction:column;width:100%;padding:14px 14px 20px;background:var(--surface);border:2px solid var(--line);border-radius:22px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:hsl(var(--h) 95% 62%);transform:translateY(-4px);outline:none}
a.card:focus-visible{box-shadow:0 0 0 4px hsl(var(--h) 95% 62%/.35)}
.stage{position:relative;display:grid;place-items:center;height:156px;margin-bottom:18px;border-radius:12px;
  background:radial-gradient(circle at 50% 60%,hsl(var(--h) 95% 60%/.28),transparent 68%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/16px 16px,var(--bg)}
.stage .sp{font-size:76px}
.card h3,.card p,.go{margin-inline:8px}
h3{margin-block:0 6px;font:700 20px/1.2 var(--display);letter-spacing:-.03em}
.card p{margin-block:0 18px;flex:1;color:var(--muted);font-size:15px}
.go{display:flex;align-items:center;gap:10px;font-weight:700}
.go i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h) 95% 62%);transition:transform .15s}
.go i::after{content:"";margin-left:3px;border-left:9px solid var(--bg);border-block:6px solid transparent}
a.card:hover .go i{transform:scale(1.18)}
.soon .card{background:transparent;border-style:dashed;--h:250}
.soon .stage{background:none;border:2px dashed var(--line);font:900 56px var(--display);color:var(--muted)}
.soon .stage b{animation:blink 1s steps(1) infinite}
.soon h3{color:var(--muted)}
.soon .go{color:var(--muted)}
.empty{display:none;padding:56px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:12px;padding:10px 22px;border:0;border-radius:99px;background:var(--yellow);color:var(--bg);font:700 15px var(--body);cursor:pointer}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:88px;padding:28px 0 44px;border-top:2px solid var(--line);color:var(--muted);font-size:15px}
footer a{color:var(--ink);text-decoration-color:var(--pink);text-decoration-thickness:2px;text-underline-offset:4px}
footer a:hover{color:var(--yellow)}
footer a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.wrap{padding:0 16px}.hero{padding:36px 0 56px}.grid{grid-template-columns:1fr}.live{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="sp" id="mark" style="--h:48"></span>Open Arcade</div>
    <span class="live">Free to play, right now</span>
  </header>

  <section class="hero">
    <h1><span class="sr">Welcome to </span><span class="a">Open</span><span class="b">Arcade</span></h1>
    <p class="lead">Pick a game and start playing. No downloads, no sign-up.</p>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="art" id="art" aria-hidden="true"></div>
  </section>

  <main>
    <div class="bar">
      <div>
        <h2>All games</h2>
        <p id="count" aria-live="polite"></p>
      </div>
    </div>
    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty">
      <p>No games match your search.</p>
      <button type="button" id="reset">Show all games</button>
    </div>
  </main>

  <footer>
    <span>For game suggestions and inquiries, contact <a href="mailto:spam.github@proton.me">spam.github@proton.me</a></span>
    <span>Open Arcade. Just pick a game and play.</span>
  </footer>
</div>

<script>
var BASE = "https://open-arcade.github.io/";
// title, description, slug, emoji, hue
var GAMES = [
  ["Crossy Road", "Cross the road without getting run over.", "crossy-road", "🐔", 48],
  ["Fivefold", "Wordle-style game but with unlimited daily rounds.", "fivefold", "🔤", 285],
  ["Dominion", "Conquer Europe directly from your browser.", "dominion", "🏰", 12],
  ["Apex GP", "Race high-speed open-wheel cars in this browser racing game.", "apex-gp", "🏎️", 8],
  ["Lane Rush", "Avoid oncoming traffic and upgrade your car.", "lane-rush", "🚗", 190],
  ["Storm Royale", "Outlast the storm and be the last one standing.", "storm-royale", "⛈️", 220],
  ["Blind Shot 3D", "Trust your gut. Pull the trigger.", "blind-shot-3d", "🎯", 335],
  ["Circle.io", "Take control of the map and take down other players.", "circle.io", "⭕", 150],
  ["Blocky Getaway", "Escape the cops, collect cars.", "blocky-getaway", "🚓", 28],
  ["Pin Planet", "The world’s greatest wonders. Where will you drop the pin?", "pin-planet", "🌍", 170],
  ["Poké Path", "A classic tower defense, but with Pokémon.", "poke-path", "⚡", 95]
];

var $ = function (s) { return document.querySelector(s); };
var query = "";

$("#mark").textContent = "👾";
$("#art").innerHTML = [0, 3, 5, 9].map(function (i) {
  return '<div class="sp" style="--h:' + GAMES[i][4] + '">' + GAMES[i][3] + "</div>";
}).join("");

function render() {
  var list = GAMES.filter(function (g) {
    return g.slice(0, 2).join(" ").toLowerCase().indexOf(query) !== -1;
  });
  var html = list.map(function (g) {
    return '<li><a class="card" style="--h:' + g[4] + '" href="' + BASE + g[2] + '/">' +
      '<div class="stage"><div class="sp" aria-hidden="true">' + g[3] + "</div></div>" +
      "<h3>" + g[0] + "</h3><p>" + g[1] + '</p><span class="go"><i></i>Play now</span></a></li>';
  }).join("");
  if (!query) {
    html += '<li class="soon"><div class="card"><div class="stage"><b>?</b></div>' +
      '<h3>Coming soon</h3><p>A new game is on the way.</p><span class="go">Stay tuned</span></div></li>';
  }
  $("#grid").innerHTML = html;
  $("#empty").style.display = list.length ? "none" : "block";
  $("#count").textContent = query
    ? list.length + " of " + GAMES.length + " games"
    : GAMES.length + " games, ready to play";
}

$("#search").addEventListener("input", function (e) { query = e.target.value.toLowerCase().trim(); render(); });
$("#reset").addEventListener("click", function () { query = ""; $("#search").value = ""; render(); });
document.addEventListener("keydown", function (e) {
  var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#search").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#search")) {
    $("#search").value = ""; query = ""; render(); $("#search").blur();
  }
});

render();
</script>
</body>
</html>
